<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>openSU</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #1b1c1e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --ink: #f2f2f7; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 500 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<p id="msg">正在返回 openSU… / Returning to openSU…</p>
<script>
  // Google sign-in ends here (task 019): tell the studio window that opened
  // this popup, then close. Opened directly (no opener): go to the studio.
  (function () {
    var error = new URLSearchParams(location.search).get('error');
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'opensu-auth', error: error || '' }, location.origin);
      window.close();
    } else {
      location.replace('/studio');
    }
  })();
</script>
</body>
</html>
