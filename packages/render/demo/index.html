<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openSU style spike</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font: 13px/1.3 system-ui, sans-serif; }
      #app { position: absolute; inset: 0; }
      .bar { position: absolute; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #ui { top: 12px; }
      #cuts { top: 44px; }
      #sun { bottom: 34px; right: 12px; }
      #dates { display: flex; flex-wrap: wrap; gap: 6px; }
      .bar button { border: 1px solid #ccc; background: #fff; padding: 4px 10px; border-radius: 3px; cursor: pointer; }
      .bar button.on { border-color: #333; }
      #time { flex: 1 1 320px; max-width: 520px; }
      #time-label { color: #555; min-width: 220px; font-variant-numeric: tabular-nums; }
      #stats { position: absolute; bottom: 10px; left: 12px; color: #888; }
      body.shot .bar, body.shot #stats { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui" class="bar"></div>
    <div id="cuts" class="bar"></div>
    <div id="sun" class="bar">
      <div id="dates"></div>
      <input id="time" type="range" min="360" max="1080" step="1" value="900" aria-label="Time of day" />
      <span id="time-label"></span>
    </div>
    <div id="stats"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
